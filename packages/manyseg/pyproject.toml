[project]
name = "manyseg"
version = "0.1.0.dev0"
description = "Composable dense-prediction models for PyTorch: timm backbones, any channel count, multiple inputs and outputs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DPIRD-DMA" }]
keywords = ["segmentation", "semantic-segmentation", "remote-sensing", "timm", "pytorch", "multi-modal", "earth-observation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]
dependencies = [
    "torch>=2.9",  # dynamic torch.export needs prefer_deferred_runtime_asserts_over_guards (2.9)
    "timm>=1.0.20",  # CAFormer dynamic export fails on 1.0.12; floor tested nightly in CI
    "safetensors>=0.4",  # manyseg.save / load (also a timm dependency; imported directly)
]

[project.optional-dependencies]
onnx = ["onnx>=1.16", "onnxscript>=0.1"]
instances = ["scipy>=1.10", "scikit-image>=0.22"]
# torchao (BSD-3-Clause): PT2E static int8 and weight-only / dynamic quantisation.
quant = ["torchao>=0.13"]
test = ["pytest>=8", "pytest-xdist>=3", "onnx>=1.16", "onnxscript>=0.1", "onnxruntime>=1.18",
        "scipy>=1.10", "scikit-image>=0.22", "torchao>=0.13"]

[project.urls]
Homepage = "https://github.com/DPIRD-DMA/ManySeg"
Repository = "https://github.com/DPIRD-DMA/ManySeg"
Issues = "https://github.com/DPIRD-DMA/ManySeg/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manyseg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: slow tests (compile, export, many backbones)",
    "cuda: requires a CUDA device",
    "mps: requires an MPS device",
    "network: downloads pretrained weights",
]
addopts = "-m 'not slow and not network' --strict-markers"
