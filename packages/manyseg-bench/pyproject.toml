[project]
name = "manyseg-bench"
version = "0.1.0.dev0"
description = "Implementation-neutral benchmarking of PyTorch segmentation models."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "torch>=2.4",
    "numpy>=1.24",
    "pillow>=10",
    "pyyaml>=6",
]

[project.optional-dependencies]
manyseg = ["manyseg"]
smp = ["segmentation-models-pytorch>=0.4"]
fastai = ["fastai>=2.7"]
test = ["pytest>=8", "manyseg"]

[project.scripts]
manyseg-bench = "manyseg_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manyseg_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: slow tests",
    "cuda: requires a CUDA device",
    "network: downloads data or weights",
]
addopts = "-m 'not slow and not network' --strict-markers"
