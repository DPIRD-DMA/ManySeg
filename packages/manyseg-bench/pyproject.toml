[project]
name = "manyseg-bench"
version = "0.1.0.dev0"
description = "Implementation-neutral benchmarking of PyTorch segmentation models."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DPIRD-DMA" }]
keywords = ["segmentation", "benchmark", "pytorch", "remote-sensing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]
dependencies = [
    "torch>=2.10",
    "numpy>=1.24",
    "pillow>=10",
    "pyyaml>=6",
]

[project.optional-dependencies]
manyseg = ["manyseg"]
smp = ["segmentation-models-pytorch>=0.4"]
fastai = ["fastai>=2.7"]
geo = [
    "tifffile>=2024.1",
    "imagecodecs>=2024.1",
    "pyarrow>=15",
    "lmdb>=1.4",
    "safetensors>=0.4",
    "h5py>=3.10",
]
vectors = ["scipy>=1.10", "shapely>=2", "networkx>=3", "rasterio>=1.3"]
test = ["pytest>=8", "manyseg", "scipy>=1.10", "shapely>=2", "networkx>=3", "rasterio>=1.3"]

[project.scripts]
manyseg-bench = "manyseg_bench.cli:main"

[project.urls]
Homepage = "https://github.com/DPIRD-DMA/ManySeg"
Repository = "https://github.com/DPIRD-DMA/ManySeg"
Issues = "https://github.com/DPIRD-DMA/ManySeg/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manyseg_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: slow tests",
    "cuda: requires a CUDA device",
    "network: downloads data or weights",
]
addopts = "-m 'not slow and not network' --strict-markers"
