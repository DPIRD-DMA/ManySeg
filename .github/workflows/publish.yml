name: Publish to PyPI

# Triggered by pushing a tag that looks like a version, e.g. `v0.1.0`.
# Publishing uses PyPI trusted publishing (OIDC): no API tokens, no secrets.
# The publisher is registered on PyPI with:
#   Owner            DPIRD-DMA
#   Repository name  ManySeg
#   Workflow name    publish.yml
#   Environment      pypi
#
# Only packages/manyseg is published; manyseg-bench stays in the repo.
# The version comes from the tag (hatch-vcs), so v0.1.0 builds 0.1.0. Date the
# CHANGELOG.md section before tagging.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history and tags so hatch-vcs can read the version

      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: "3.11"

      - name: Build sdist + wheel
        run: uv build --package manyseg -o dist

      # fails on a tag hatch-vcs normalises (v0.1.0-rc1 builds 0.1.0rc1) or cannot see
      - name: Check the built version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ ! -f "dist/manyseg-${tag}.tar.gz" ]; then
            echo "::error::tag $GITHUB_REF_NAME did not build version $tag; dist/ has:"
            ls dist/
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/manyseg
    permissions:
      id-token: write  # required for trusted publishing

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to create releases

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
