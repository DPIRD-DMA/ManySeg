name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["experiments/**", "docs/**", "scripts/setonix/**", "**.md"]
  pull_request:
    paths-ignore: ["experiments/**", "docs/**", "scripts/setonix/**", "**.md"]
  schedule:
    - cron: "0 18 * * *"  # 02:00 AWST; the only place macOS runs outside PRs
  workflow_dispatch:

# Back-to-back pushes: only the newest commit gets tested.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.12"]
        # macos-14 (arm64) exercises the MPS device tests. macOS minutes bill
        # at 10x, so it runs on PRs, nightly and on demand, not on every push.
        include: >-
          ${{ fromJSON(github.event_name == 'push' && '[]' || '[{"os": "macos-14", "python": "3.12"}]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install (CPU torch wheels on Linux)
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install --torch-backend auto \
            -e "packages/manyseg[test]" -e "packages/manyseg-bench[smp,fastai,test]"
      - name: Library must install and import without the benchmark
        run: |
          uv venv --python ${{ matrix.python }} /tmp/libonly
          VIRTUAL_ENV=/tmp/libonly uv pip install --torch-backend auto -e packages/manyseg
          /tmp/libonly/bin/python -c "import manyseg, sys; assert 'manyseg_bench' not in sys.modules"
      - name: manyseg unit tests
        run: uv run --no-sync pytest packages/manyseg -n 2 -q
      - name: manyseg-bench tests
        run: uv run --no-sync pytest packages/manyseg-bench -n 2 -q

  slow:
    name: slow (compile / export / ONNX)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: |
          uv venv --python 3.12
          uv pip install --torch-backend cpu -e "packages/manyseg[test]"
      - run: uv run --no-sync pytest packages/manyseg -m slow -n 2 -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check packages examples

  package:
    name: build + install wheels
    runs-on: ubuntu-latest
    # PRs, nightly and on demand only (CI budget): builds both packages, checks the metadata and
    # installs the manyseg wheel alone into a clean env.
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build --all-packages -o dist && uvx twine check dist/*
      - run: |
          uv venv --python 3.12 /tmp/wheel
          VIRTUAL_ENV=/tmp/wheel uv pip install --torch-backend cpu dist/manyseg-*.whl
          /tmp/wheel/bin/python -c "import torch, importlib.util; from manyseg import create_model; m = create_model(backbone='resnet18', pretrained=False, in_channels=4, num_classes=3).eval(); assert m(torch.randn(1, 4, 65, 97)).shape == (1, 3, 65, 97); assert importlib.util.find_spec('manyseg_bench') is None"
