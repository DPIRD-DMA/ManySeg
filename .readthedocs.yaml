# Read the Docs: builds the MkDocs site assembled by scripts/build_docs.py (README, docs/,
# examples/, every experiment write-up and the API reference generated from the docstrings).
# docs/requirements.txt has the tools; the reference is read statically, so torch and the
# extras are not installed. Needs the repo to be public (RTD Community) or RTD for Business
# for a private repo.
version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  commands:
    - pip install -r docs/requirements.txt
    - python scripts/build_docs.py
