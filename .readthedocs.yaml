# Read the Docs: builds the MkDocs site assembled by scripts/build_docs.py (README, docs/,
# examples/ and every experiment write-up). Needs the repo to be public (RTD Community) or RTD
# for Business for a private repo.
version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  commands:
    - pip install "mkdocs<2" "mkdocs-material<10"
    - python scripts/build_docs.py
